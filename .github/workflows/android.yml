name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit, Robolectric UI and end-to-end tests
        run: ./gradlew testDebugUnitTest :core:domain:test :core:common:test :app:testMockDebugUnitTest --continue
      - name: Lint
        run: ./gradlew :app:lintLiveDebug
      - name: Build development and production APKs
        run: ./gradlew :app:assembleMockDebug :app:assembleLiveRelease
      - name: Upload screenshots from the end-to-end test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: app/build/screenshots
